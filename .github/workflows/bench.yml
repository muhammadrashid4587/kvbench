# Benchmark cinder with kvbench on every push.
#
# The workflow checks out this repo and cinder, builds cinder, starts it,
# and runs kvbench against it with the checked-in SLO preset (slo.json).
# kvbench exits 4 when the SLO gate breaches, which fails this workflow,
# so a push that makes cinder too slow or too error-prone goes red.
# The Markdown and JSON reports are uploaded as an artifact either way,
# so a failed run still leaves its report behind to look at.
#
# This workflow cannot be executed end-to-end from a dev VM (there is no
# GitHub Actions runner there); the exact commands it runs are verified
# locally instead — see "Continuous benchmarking" in the README.

name: bench

on:
  push:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Check out kvbench
        uses: actions/checkout@v4

      - name: Check out cinder
        uses: actions/checkout@v4
        with:
          repository: muhammadrashid4587/cinder
          path: cinder

      - name: Build cinder
        run: make -C cinder

      - name: Start cinder
        run: |
          cd cinder
          mkdir -p data
          ./cinder --port 6379 --data-dir ./data --aof-fsync everysec &
          python3 - <<'EOF'
          import socket
          import time
          deadline = time.time() + 30
          while True:
              try:
                  with socket.create_connection(("127.0.0.1", 6379), timeout=1):
                      break
              except OSError:
                  if time.time() > deadline:
                      raise SystemExit("cinder did not start within 30s")
                  time.sleep(0.2)
          print("cinder is listening on 127.0.0.1:6379")
          EOF

      - name: Benchmark cinder
        run: >-
          python3 -m kvbench.cli --host 127.0.0.1 --port 6379
          --ops 20000 --clients 4
          --slo-preset slo.json --output report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvbench-report
          path: |
            report.md
            report.json
